global:
  scrape_interval: 60s
  evaluation_interval: 60s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: capturing-node
    static_configs:
      - targets: ['localhost:9100']
    relabel_configs:
      - target_label: node
        replacement: capturing

  - job_name: processing-pipeline
    static_configs:
      - targets: ['localhost:8000']
    relabel_configs:
      - target_label: node
        replacement: processing
