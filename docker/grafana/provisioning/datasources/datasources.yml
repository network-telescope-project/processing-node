apiVersion: 1

datasources:

  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: clickhouse-telescope
    isDefault: true
    jsonData:
      host: clickhouse
      port: 9000
      username: nt_reader
      defaultDatabase: telescope
      protocol: native
    secureJsonData:
      password: $CLICKHOUSE_RO_PASSWORD

  - name: Prometheus
    type: prometheus
    uid: prometheus-telescope
    url: http://prometheus:9090
    isDefault: false
    jsonData:
      timeInterval: 60s
